<header class="md-header" data-md-component="header">
  <nav class="md-header__inner md-grid" aria-label="Header">
    <label class="md-header__button md-icon" for="__drawer" aria-label="Open navigation">
      {% include ".icons/material/menu.svg" %}
    </label>
    <a href="{{ nav.homepage.url | url }}" class="md-header__button md-logo" aria-label="VSUART documentation">
      {% include "partials/logo.html" %}
    </a>
    <div class="md-header__title" data-md-component="header-title">
      <div class="md-header__ellipsis">
        <div class="md-header__topic"><span class="md-ellipsis">{{ config.site_name }}</span></div>
        <div class="md-header__topic" data-md-component="header-topic"><span class="md-ellipsis">{{ page.title if page else config.site_name }}</span></div>
      </div>
    </div>
    {% include "partials/palette.html" %}
    {% include "partials/javascripts/palette.html" %}
    <label class="md-header__button md-icon" for="__search" aria-label="Open search">
      {% include ".icons/material/magnify.svg" %}
    </label>
    <p class="docs-header-subtitle">Technical documentation</p>
    {% include "partials/search.html" %}
  </nav>
</header>
